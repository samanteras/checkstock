name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: checkstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checkstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run integration and HTTP tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/checkstock_test
        run: python -m unittest discover -s tests -v
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run browser flow
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/checkstock
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/checkstock_test
          CHECKSTOCK_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m checkstock.bootstrap
          python -m uvicorn checkstock.api:app --host 127.0.0.1 --port 8000 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          python -m unittest discover -s tests -p 'test_browser.py' -v
